<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>问枢 · 客服分流与工单助手</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#15243b;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}
    header{background:#172941;color:white;padding:22px 6%;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:25px}header p{margin:4px 0;color:#b9c8dc;font-size:13px}
    main{max-width:1180px;margin:26px auto;display:grid;grid-template-columns:280px 1fr;gap:22px;padding:0 20px}.card{background:white;border:1px solid #e0e6ef;border-radius:14px;padding:22px;box-shadow:0 4px 16px #24375106}
    label{display:block;font-size:13px;margin-bottom:6px}input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;font:inherit;background:white}button{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;font:inherit;background:#2166c8;color:white}button:disabled{opacity:.5;cursor:wait}.secondary{background:#eaf0f8;color:#294767}.chips button{display:block;width:100%;text-align:left;margin:8px 0;font-size:13px}.muted{color:#63748a;font-size:13px}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
    #chat{height:470px;overflow:auto;padding:6px 4px;scroll-behavior:smooth}.message{white-space:pre-wrap;overflow-wrap:anywhere;margin:14px 0;padding:12px 16px;border-radius:12px;max-width:92%}.user{margin-left:auto;background:#2166c8;color:white}.assistant{background:#eef3f9}.error{background:#fff0ec;color:#943d27}.meta{font-size:12px;color:#63748a;margin:0 4px 18px}details{font-size:12px;color:#506780;padding:4px}#status{background:#294564;border-radius:20px;padding:6px 12px;font-size:12px}a{color:#3173bb}#notice{min-height:26px;margin-top:8px;color:#a34529;font-size:13px}textarea{resize:vertical;min-height:78px}.submit{display:flex;align-items:center;justify-content:space-between;margin-top:9px}footer{text-align:center;color:#75849a;font-size:12px;margin:22px}#tickets{max-height:190px;overflow:auto}.ticket{padding:8px 0;border-bottom:1px solid #edf0f5;font-size:12px}
    dialog{border:1px solid #cbd5e1;border-radius:14px;width:min(900px,94vw);max-height:86vh;padding:24px}dialog::backdrop{background:#17294199}#docbody{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.8 system-ui,sans-serif}.source{border-left:3px solid #6994cb;padding:8px 12px;margin:8px 0;white-space:pre-wrap}.source blockquote{margin:8px 0;max-height:180px;overflow:auto;color:#42566e}.docrow{display:block;width:100%;text-align:left;margin:6px 0}#documents{max-height:260px;overflow:auto}
    @media(max-width:760px){main{grid-template-columns:1fr}.card{padding:16px}header{padding:16px 20px}#chat{height:420px}.chips{display:none}}
  </style>
</head>
<body>
<header><div><h1>问枢 <span style="font-size:15px;font-weight:400">WenShu</span></h1><p>Zulip 文档客服演示 · 知识咨询 · 本地工单</p></div><span id="status">正在连接服务</span></header>
<main>
  <aside>
    <section class="card"><label for="key">本地服务 API Key</label><input id="key" type="password" autocomplete="off" placeholder="填写 .env 中的服务密钥">
      <div class="row"><button id="connect">连接并新建会话</button></div><p class="muted">密钥仅保存在当前页面内存中。不同密钥的会话和工单相互隔离。</p><div id="notice" role="status"></div>
      <div class="chips"><h3>试试这些问题</h3><button class="secondary" data-prompt="Zulip 忘记密码怎么重置？">忘记密码怎么重置？</button><button class="secondary" data-prompt="如何限制谁可以看到我的邮箱？">如何隐藏邮箱地址？</button><button class="secondary" data-prompt="创建工单：无法收到登录邮件">提交登录问题工单</button><button class="secondary" data-prompt="转人工">转接人工客服</button></div>
      <h3>文档知识库</h3><p class="muted" id="corpus">正在读取文档信息</p><button class="secondary" id="browse">浏览原始资料</button><div id="documents"></div>
      <h3>我的工单</h3><button class="secondary" id="refresh">刷新工单</button><div id="tickets"></div>
      <p class="muted"><a href="/docs" target="_blank" rel="noopener">查看 API 文档 ↗</a></p>
    </section>
  </aside>
  <section class="card"><div style="display:flex;justify-content:space-between"><strong>客服会话</strong><span id="session" class="muted">尚未连接</span></div>
    <div id="chat" role="log" aria-live="polite"><div class="message assistant">你好，我是问枢。连接后可以咨询常见问题、查询工单或提交问题。创建工单前，我会向你确认内容。</div></div>
    <form id="form"><label for="message">你的问题</label><textarea id="message" maxlength="1500" placeholder="输入问题，Enter 发送，Shift+Enter 换行" required></textarea>
      <div class="submit"><span class="muted">本地学习演示 · 工单提交前需确认</span><button id="send" disabled>发送</button></div>
    </form>
  </section>
</main>
<dialog id="document"><button class="secondary" id="closeDoc">关闭文档</button><h2 id="doctitle"></h2><div id="doclinks"></div><pre id="docbody"></pre></dialog>
<footer>学习项目 · Zulip 官方文档快照 · 工单仅保存在本机，不会提交给 Zulip</footer>
<script>
const $=id=>document.getElementById(id);let session=null,busy=false,key='',lastFailed=null;
async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-API-Key':key},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));return j}
function bubble(text,role){const d=document.createElement('div');d.className='message '+role;d.textContent=text;$('chat').append(d);$('chat').scrollTop=$('chat').scrollHeight}
function sourceLink(parent,url,label){try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))return;const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;parent.append(a,document.createTextNode('  '))}catch{}}
async function openDoc(id){try{const d=await api('/knowledge/documents/'+encodeURIComponent(id));$('doctitle').textContent=d.title;$('docbody').textContent=d.text;$('doclinks').replaceChildren();sourceLink($('doclinks'),d.url,'官方帮助页 ↗');sourceLink($('doclinks'),d.upstream_url,'固定版本原文 ↗');$('document').showModal()}catch(e){$('notice').textContent=e.message}}
$('closeDoc').onclick=()=>$('document').close();
$('browse').onclick=async()=>{try{const result=await api('/knowledge/documents');$('documents').replaceChildren();for(const d of result.documents){const b=document.createElement('button');b.className='secondary docrow';b.textContent=d.title;b.onclick=()=>openDoc(d.id);$('documents').append(b)}}catch(e){$('notice').textContent='请先连接服务。'+e.message}};
function sources(rows){if(!rows.length)return;const panel=document.createElement('details');const title=document.createElement('summary');title.textContent='查看文档依据（'+rows.filter(s=>s.cited).length+' 段已引用 / '+rows.length+' 段检索结果）';panel.append(title);for(const s of rows){const card=document.createElement('div');card.className='source';const label=document.createElement('strong');label.textContent=(s.cited?'已引用 · ':'候选 · ')+(s.title||s.source)+' / '+(s.section||'');card.append(label,document.createElement('br'));const info=document.createElement('span');info.textContent='行 '+s.line_start+'–'+s.line_end+' · 相似度 '+s.score+'（非可信概率）';card.append(info,document.createElement('br'));sourceLink(card,s.upstream_url,'固定版本原文 ↗');if(s.doc_id){const b=document.createElement('button');b.className='secondary';b.textContent='查看完整文档';b.onclick=()=>openDoc(s.doc_id);card.append(b)}const quote=document.createElement('blockquote');quote.textContent=s.excerpt;card.append(quote);panel.append(card)}$('chat').append(panel)}
async function refresh(){try{const rows=await api('/tickets');$('tickets').replaceChildren();for(const row of rows){const d=document.createElement('div');d.className='ticket';d.textContent=row.id+'\n'+row.title+' · '+row.status;d.style.whiteSpace='pre-wrap';$('tickets').append(d)}}catch(e){$('notice').textContent=e.message}}
$('connect').onclick=async()=>{if(busy)return;$('notice').textContent='';key=$('key').value.trim();try{const r=await api('/sessions','POST');session=r.session_id;lastFailed=null;$('session').textContent=session.slice(0,8);$('send').disabled=false;$('chat').replaceChildren();bubble('已开启新会话。有什么可以帮你？','assistant');refresh()}catch(e){session=null;$('send').disabled=true;$('notice').textContent=e.message}};
$('refresh').onclick=refresh;
document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('message').value=b.dataset.prompt;$('message').focus()});
$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};
$('form').onsubmit=async e=>{e.preventDefault();const message=$('message').value.trim();if(!message||!session||busy)return;busy=true;$('send').disabled=true;$('connect').disabled=true;
const body=lastFailed&&lastFailed.message===message?lastFailed:{session_id:session,request_id:crypto.randomUUID(),message};bubble(message,'user');$('message').value='';
try{const r=await api('/chat','POST',body);lastFailed=null;bubble(r.reply,'assistant');sources(r.sources);const meta=document.createElement('details');const summary=document.createElement('summary');summary.textContent=r.intent+' · '+r.elapsed_ms+' ms · 查看处理路径';meta.append(summary);const info=document.createElement('div');info.textContent=r.trace.join(' → ');info.style.whiteSpace='pre-wrap';meta.append(info);$('chat').append(meta);
const rating=document.createElement('div');rating.className='meta';rating.append('本次回复：');for(const [label,n]of [['有帮助',5],['需改进',2]]){const b=document.createElement('button');b.className='secondary';b.style.fontSize='12px';b.textContent=label;b.onclick=async()=>{try{await api('/feedback','POST',{request_id:r.request_id,rating:n});rating.textContent='感谢反馈'}catch(e){$('notice').textContent=e.message}};rating.append(b)}$('chat').append(rating);refresh();if(r.status==='handoff_pending')session=null;
}catch(e){lastFailed=body;$('message').value=message;bubble(e.message+'；可重试同一消息。','error')}finally{busy=false;$('send').disabled=!session;$('connect').disabled=false;$('chat').scrollTop=$('chat').scrollHeight}};
fetch('/health').then(r=>r.json()).then(r=>{$('status').textContent=(r.model_mode==='offline'?'离线原文摘录':'模型已配置')+' · '+(r.retrieval_mode==='lexical'?'词项检索':'BGE 语义检索');$('corpus').textContent=r.document_count+' 篇文档 · '+r.chunk_count+' 个片段。英文官方资料，语义检索模式支持中文提问。'}).catch(()=>{$('status').textContent='服务未连接'});
</script>
</body></html>
