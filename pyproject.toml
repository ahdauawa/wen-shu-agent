[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wen-shu-agent"
version = "0.1.0"
description = "问枢：LangGraph + FastAPI 客服分流与工单助手"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langgraph>=1,<2",
  "httpx>=0.27,<1",
  "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
rag = ["chromadb>=1,<2", "sentence-transformers>=3,<6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "data/*.json"]
